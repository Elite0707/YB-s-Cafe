services:
  - type: web
    name: ybs-cafe
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: cafe-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_PATH
        value: /var/data/cafe.sqlite
      - key: UPLOADS_PATH
        value: /var/data/uploads
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_KEY
        generateValue: true
